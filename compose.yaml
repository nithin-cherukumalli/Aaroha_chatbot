services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_engineering
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ai_engineering"]
      interval: 5s
      timeout: 3s
      retries: 10
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports: ["6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]
volumes:
  qdrant-data:

