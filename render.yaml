services:
  - type: web
    name: ai-engineering-knowledge-assistant
    runtime: docker
    plan: starter
    healthCheckPath: /health/live
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: INGESTION_RUNNER
        value: separate
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
  - type: worker
    name: ai-engineering-ingestion-worker
    runtime: docker
    plan: starter
    dockerCommand: python -m app.worker
    envVars:
      - key: APP_ENV
        value: production
      - key: INGESTION_RUNNER
        value: separate
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false

