services:
  - type: web
    name: aaroha-rag
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: COLLECTION_NAME
        value: aaroha_rag
      - key: EMBED_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBED_DIM
        value: "384"
