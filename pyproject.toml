[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-knowledge-assistant"
version = "0.1.0"
description = "Grounded AI engineering knowledge assistant"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "itsdangerous>=2.2,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pypdf>=5,<6",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.12,<1",
  "qdrant-client>=1.12,<2",
  "psycopg[binary]>=3.2,<4",
  "SQLAlchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=6,<7", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"] # FastAPI dependency declarations and deliberately readable prompts.

[tool.setuptools.packages.find]
include = ["app*", "evaluations*"]

