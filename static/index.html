<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aaroha — Knowledge Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh; display: flex; flex-direction: column;
      background: #f7f8fa; color: #1a1a2e;
    }

    header {
      background: #fff; border-bottom: 1px solid #e8eaf0;
      padding: 14px 28px; display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .brand { font-size: 16px; font-weight: 700; color: #4f46e5; letter-spacing: -.3px; }
    .brand span { color: #1a1a2e; font-weight: 400; margin-left: 6px; font-size: 14px; }
    .manage-link {
      font-size: 13px; color: #4f46e5; text-decoration: none; font-weight: 500;
      padding: 7px 14px; border: 1px solid #e0deff; border-radius: 8px;
      transition: background .15s;
    }
    .manage-link:hover { background: #f0efff; }

    .messages {
      flex: 1; overflow-y: auto; padding: 32px 0;
      display: flex; flex-direction: column; gap: 20px;
    }

    .empty {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 10px; color: #b0b8cc; padding-bottom: 80px;
    }
    .empty .icon { font-size: 44px; }
    .empty h2 { font-size: 18px; font-weight: 600; color: #6b7280; }
    .empty p { font-size: 14px; }

    .msg-row {
      display: flex; padding: 0 28px;
    }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.bot  { justify-content: flex-start; }

    .bubble {
      max-width: 72%; padding: 13px 17px; border-radius: 14px;
      font-size: 14px; line-height: 1.6; word-break: break-word;
    }
    .msg-row.user .bubble {
      background: #4f46e5; color: #fff; border-bottom-right-radius: 4px;
    }
    .msg-row.bot .bubble {
      background: #fff; border: 1px solid #e4e7ef; color: #1a1a2e;
      border-bottom-left-radius: 4px;
    }

    .sources {
      margin-top: 8px; display: flex; flex-wrap: wrap; gap: 5px; padding: 0 2px;
    }
    .src-tag {
      background: #f0efff; color: #4f46e5; font-size: 11.5px;
      padding: 3px 9px; border-radius: 20px;
      max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* Typing dots */
    .dots { display: flex; gap: 5px; align-items: center; padding: 2px 0; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%; background: #c4c8d4;
      animation: pop .9s infinite;
    }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes pop {
      0%, 60%, 100% { transform: translateY(0); opacity: .5; }
      30%            { transform: translateY(-7px); opacity: 1; }
    }

    /* Input bar */
    .input-bar {
      padding: 16px 28px; background: #fff; border-top: 1px solid #e8eaf0;
      display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0;
    }
    textarea {
      flex: 1; border: 1px solid #e4e7ef; border-radius: 10px;
      padding: 11px 15px; font-size: 14px; font-family: inherit;
      resize: none; outline: none; line-height: 1.5; max-height: 130px;
      transition: border-color .18s; overflow-y: auto; background: #fafafa;
    }
    textarea:focus { border-color: #4f46e5; background: #fff; }
    .send-btn {
      background: #4f46e5; color: #fff; border: none; border-radius: 10px;
      padding: 11px 22px; font-size: 14px; font-weight: 500;
      cursor: pointer; transition: background .18s; flex-shrink: 0;
    }
    .send-btn:hover { background: #4338ca; }
    .send-btn:disabled { background: #d1d5db; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <div class="brand">⚡ Aaroha <span>Knowledge Assistant</span></div>
  <a class="manage-link" href="/manage">📁 Manage Documents</a>
</header>

<div class="messages" id="messages">
  <div class="empty" id="empty">
    <div class="icon">💬</div>
    <h2>Ask me anything</h2>
    <p>Questions are answered from your uploaded knowledge base</p>
  </div>
</div>

<div class="input-bar">
  <textarea id="q" placeholder="Ask a question… (Enter to send, Shift+Enter for new line)" rows="1"></textarea>
  <button class="send-btn" id="send-btn" onclick="send()">Send</button>
</div>

<script>
  const qEl     = document.getElementById('q');
  const sendBtn = document.getElementById('send-btn');
  const msgs    = document.getElementById('messages');

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function addMsg(role, text, sources) {
    document.getElementById('empty')?.remove();

    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;          // plain text — no HTML injection
    row.appendChild(bubble);

    if (sources && sources.length) {
      const s = document.createElement('div');
      s.className = 'sources';
      // sources sit below the bubble, outside it
      const wrap = document.createElement('div');
      wrap.style.cssText = 'max-width:72%;display:flex;flex-direction:column;';
      wrap.appendChild(bubble);
      sources.forEach(f => {
        const t = document.createElement('span');
        t.className = 'src-tag'; t.textContent = f; t.title = f;
        s.appendChild(t);
      });
      wrap.appendChild(s);
      row.appendChild(wrap);
      row.removeChild(bubble);
    }

    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row bot'; row.id = 'typing';
    row.innerHTML = `<div class="bubble"><div class="dots">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div></div>`;
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  async function send() {
    const q = qEl.value.trim();
    if (!q || sendBtn.disabled) return;
    qEl.value = ''; resize();
    sendBtn.disabled = true;
    addMsg('user', q);
    showTyping();
    try {
      const r = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q }),
      });
      const d = await r.json();
      document.getElementById('typing')?.remove();
      if (!r.ok) throw new Error(d.detail || 'Error');
      addMsg('bot', d.answer, d.sources);
    } catch(e) {
      document.getElementById('typing')?.remove();
      addMsg('bot', 'Error: ' + e.message);
    }
    sendBtn.disabled = false;
    qEl.focus();
  }

  function resize() {
    qEl.style.height = 'auto';
    qEl.style.height = Math.min(qEl.scrollHeight, 130) + 'px';
  }
  qEl.addEventListener('input', resize);
  qEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
</script>
</body>
</html>
