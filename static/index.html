<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aaroha — Knowledge Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh; display: flex; background: #f7f8fa; color: #1a1a2e;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 280px; min-width: 280px; background: #fff;
      border-right: 1px solid #e8eaf0; display: flex; flex-direction: column;
      padding: 20px 16px;
    }
    .logo { font-size: 17px; font-weight: 700; color: #4f46e5; margin-bottom: 20px; letter-spacing: -0.3px; }

    .upload-zone {
      border: 2px dashed #d4d8e8; border-radius: 10px; padding: 20px 12px;
      text-align: center; cursor: pointer; transition: all .18s; margin-bottom: 12px;
    }
    .upload-zone:hover, .upload-zone.over { border-color: #4f46e5; background: #f0efff; }
    .upload-zone .icon { font-size: 26px; margin-bottom: 6px; }
    .upload-zone p { font-size: 13px; color: #555; line-height: 1.4; }
    .upload-zone p span { color: #4f46e5; font-weight: 600; cursor: pointer; }
    #file-input { display: none; }

    .upload-status {
      font-size: 12.5px; min-height: 18px; margin-bottom: 14px;
      padding: 0 4px; transition: color .2s;
    }
    .upload-status.ok { color: #16a34a; }
    .upload-status.err { color: #dc2626; }

    .section-label {
      font-size: 11px; font-weight: 600; color: #9ca3af;
      text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px;
    }
    .doc-list { flex: 1; overflow-y: auto; }
    .doc-item {
      display: flex; align-items: center; gap: 8px; padding: 7px 8px;
      border-radius: 7px; font-size: 13px; color: #374151;
      transition: background .12s;
    }
    .doc-item:hover { background: #f3f4f6; }
    .doc-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-item .chunks { font-size: 11px; color: #9ca3af; white-space: nowrap; }
    .doc-item .del {
      cursor: pointer; color: #d1d5db; font-size: 17px; line-height: 1;
      padding: 0 2px; transition: color .12s;
    }
    .doc-item .del:hover { color: #ef4444; }
    .no-docs { font-size: 13px; color: #c4c4c4; padding: 8px 4px; }

    /* ── Chat ── */
    .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    .chat-header {
      padding: 16px 24px; background: #fff; border-bottom: 1px solid #e8eaf0;
      flex-shrink: 0;
    }
    .chat-header h1 { font-size: 16px; font-weight: 600; }
    .chat-header p { font-size: 12.5px; color: #9ca3af; margin-top: 2px; }

    .messages {
      flex: 1; overflow-y: auto; padding: 24px 28px;
      display: flex; flex-direction: column; gap: 18px;
    }

    .empty {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; color: #c4c8d4; gap: 8px; padding-bottom: 60px;
    }
    .empty .big { font-size: 40px; }
    .empty p { font-size: 14px; }

    .msg { display: flex; flex-direction: column; max-width: 78%; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.bot  { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 11px 15px; border-radius: 14px; font-size: 14px; line-height: 1.55;
      word-break: break-word;
    }
    .msg.user .bubble {
      background: #4f46e5; color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.bot .bubble {
      background: #fff; border: 1px solid #e4e7ef; color: #1a1a2e;
      border-bottom-left-radius: 4px;
    }

    .sources {
      margin-top: 5px; display: flex; flex-wrap: wrap; gap: 5px;
    }
    .sources .tag {
      background: #f0efff; color: #4f46e5; font-size: 11.5px;
      padding: 2px 8px; border-radius: 20px; max-width: 200px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* Typing indicator */
    .typing { align-self: flex-start; }
    .dots { display: flex; gap: 5px; padding: 13px 16px; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%; background: #c4c8d4;
      animation: pop .9s infinite;
    }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes pop {
      0%, 60%, 100% { transform: translateY(0); opacity: .6; }
      30% { transform: translateY(-7px); opacity: 1; }
    }

    /* Input */
    .input-bar {
      padding: 14px 20px; background: #fff; border-top: 1px solid #e8eaf0;
      display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0;
    }
    textarea {
      flex: 1; border: 1px solid #e4e7ef; border-radius: 10px;
      padding: 10px 14px; font-size: 14px; font-family: inherit;
      resize: none; outline: none; line-height: 1.5; max-height: 120px;
      transition: border-color .18s; overflow-y: auto;
    }
    textarea:focus { border-color: #4f46e5; }
    .send {
      background: #4f46e5; color: #fff; border: none; border-radius: 10px;
      padding: 10px 18px; font-size: 14px; font-weight: 500; cursor: pointer;
      transition: background .18s; white-space: nowrap; flex-shrink: 0;
    }
    .send:hover { background: #4338ca; }
    .send:disabled { background: #d1d5db; cursor: not-allowed; }
  </style>
</head>
<body>

<!-- ── Sidebar ── -->
<aside class="sidebar">
  <div class="logo">⚡ Aaroha RAG</div>

  <div class="upload-zone" id="zone">
    <div class="icon">📂</div>
    <p>Drop a file or <span onclick="document.getElementById('file-input').click()">browse</span></p>
    <p style="margin-top:4px;font-size:11.5px;color:#aaa">PDF · TXT · DOCX</p>
  </div>
  <input type="file" id="file-input" accept=".pdf,.txt,.docx">

  <div class="upload-status" id="status"></div>

  <div class="section-label">Uploaded Documents</div>
  <div class="doc-list" id="doc-list"></div>
</aside>

<!-- ── Chat ── -->
<main class="chat">
  <div class="chat-header">
    <h1>Knowledge Assistant</h1>
    <p>Ask anything about your uploaded documents</p>
  </div>

  <div class="messages" id="messages">
    <div class="empty" id="empty">
      <div class="big">💬</div>
      <p>Upload documents, then ask questions</p>
    </div>
  </div>

  <div class="input-bar">
    <textarea id="q" placeholder="Ask a question… (Enter to send, Shift+Enter for new line)" rows="1"></textarea>
    <button class="send" id="send" onclick="send()">Send</button>
  </div>
</main>

<script>
  const zone   = document.getElementById('zone');
  const fi     = document.getElementById('file-input');
  const status = document.getElementById('status');
  const docList= document.getElementById('doc-list');
  const msgs   = document.getElementById('messages');
  const qEl    = document.getElementById('q');
  const sendBtn= document.getElementById('send');

  // ── Upload drag/drop ──
  zone.addEventListener('click', () => fi.click());
  zone.addEventListener('dragover',  e => { e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('over'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('over');
    if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
  });
  fi.addEventListener('change', () => { if (fi.files[0]) upload(fi.files[0]); fi.value = ''; });

  async function upload(file) {
    setStatus(`Uploading ${file.name}…`, '');
    const fd = new FormData();
    fd.append('file', file);
    try {
      const r = await fetch('/upload', { method: 'POST', body: fd });
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || 'Upload failed');
      setStatus(`✓ ${file.name} · ${d.chunks} chunks`, 'ok');
      loadDocs();
    } catch(e) {
      setStatus(`✗ ${e.message}`, 'err');
    }
  }

  function setStatus(msg, cls) {
    status.textContent = msg;
    status.className = 'upload-status' + (cls ? ' ' + cls : '');
  }

  // ── Documents ──
  async function loadDocs() {
    const { documents } = await fetch('/documents').then(r => r.json());
    if (!documents.length) {
      docList.innerHTML = '<div class="no-docs">No documents yet</div>';
      return;
    }
    docList.innerHTML = documents.map(d => `
      <div class="doc-item">
        <span>📄</span>
        <span class="name" title="${esc(d.filename)}">${esc(d.filename)}</span>
        <span class="chunks">${d.chunks}c</span>
        <span class="del" title="Remove" onclick="delDoc('${esc(d.filename)}')">×</span>
      </div>
    `).join('');
  }

  async function delDoc(filename) {
    if (!confirm(`Remove "${filename}"?`)) return;
    await fetch('/documents/' + encodeURIComponent(filename), { method: 'DELETE' });
    loadDocs();
  }

  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // ── Chat ──
  function addMsg(role, html, sources) {
    document.getElementById('empty')?.remove();
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = `<div class="bubble">${html}</div>`;
    if (sources && sources.length) {
      const s = document.createElement('div');
      s.className = 'sources';
      s.innerHTML = sources.map(f => `<span class="tag" title="${esc(f)}">${esc(f)}</span>`).join('');
      div.appendChild(s);
    }
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'msg bot typing'; div.id = 'typing';
    div.innerHTML = `<div class="bubble"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  async function send() {
    const q = qEl.value.trim();
    if (!q || sendBtn.disabled) return;
    qEl.value = ''; autoResize();
    sendBtn.disabled = true;
    addMsg('user', esc(q).replace(/\n/g,'<br>'));
    showTyping();
    try {
      const r = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q }),
      });
      const d = await r.json();
      document.getElementById('typing')?.remove();
      if (!r.ok) throw new Error(d.detail || 'Error');
      addMsg('bot', esc(d.answer).replace(/\n/g,'<br>'), d.sources);
    } catch(e) {
      document.getElementById('typing')?.remove();
      addMsg('bot', `<span style="color:#dc2626">Error: ${esc(e.message)}</span>`);
    }
    sendBtn.disabled = false;
    qEl.focus();
  }

  qEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  function autoResize() {
    qEl.style.height = 'auto';
    qEl.style.height = Math.min(qEl.scrollHeight, 120) + 'px';
  }
  qEl.addEventListener('input', autoResize);

  loadDocs();
</script>
</body>
</html>
